# GitHub Pages への自動デプロイ (main ブランチ push 時)
#
# チップ照合テストが参照する C# リファレンス値 (reference.json) は
# src/core/chips/__tests__/fixtures/ としてリポジトリ管理しているため、
# CI でも `npm test` (src/ 配下の単体テスト) を実行できる。
# (tools/qdf-probe の実測プローブは C# リファレンスツールの生成物を必要とするため
#  `npm run test:probe` によるローカル実行のみ。CI では実行しない)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続 push 時に古いデプロイを打ち切る
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
